name: Apply real license compatibility patch

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/real_license_patch.py
      - .github/workflows/real-license-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply focused patch
        run: python3 .github/scripts/real_license_patch.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @workspace/real-estate-feasibility run typecheck

      - name: Production build
        env:
          PORT: 5000
          BASE_PATH: /real-estate-feasibility-saudi/
        run: pnpm --filter @workspace/real-estate-feasibility run build

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/real-estate-feasibility/src/App.tsx artifacts/real-estate-feasibility/src/lib/project-model.ts artifacts/real-estate-feasibility/src/lib/report-generator.ts
          if git diff --cached --quiet; then
            echo "No application changes to commit."
          else
            git commit -m "Support irregular plots and license service areas"
            git push origin main
          fi
